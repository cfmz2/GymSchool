<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Дневник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #10131A; color: white; padding: 20px; }
        .btn { background: #4C8DFF; color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; font-size: 16px; margin-top: 10px; }
        #data { margin-top: 20px; white-space: pre-wrap; background: #1C1F26; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>
    <h2>Мой Дневник</h2>
    <button class="btn" onclick="loadGrades()">📊 Загрузить оценки</button>
    <button class="btn" onclick="loadSchedule()">📅 Загрузить расписание</button>
    <div id="data">Данные появятся здесь...</div>

    <script>
        Telegram.WebApp.ready();
        const tg = Telegram.WebApp;

        // Адрес твоего сервера (замени на свой)
        const SERVER_URL = "https://твой-сервер.ру";

        async function fetchFromServer(path) {
            const response = await fetch(`${SERVER_URL}/proxy/${path}`, {
                headers: {
                    'X-Telegram-Id': tg.initDataUnsafe.user.id
                }
            });
            if (!response.ok) throw new Error('Ошибка сервера');
            return await response.json();
        }

        async function loadGrades() {
            const dataDiv = document.getElementById('data');
            dataDiv.textContent = 'Загрузка...';
            try {
                // Здесь будет логика запроса к /proxy/webapi/context и т.д.
                // Пока просто заглушка для теста
                dataDiv.textContent = 'Оценки загружены (тест)';
            } catch (e) {
                dataDiv.textContent = 'Ошибка: ' + e.message;
            }
        }

        async function loadSchedule() {
            const dataDiv = document.getElementById('data');
            dataDiv.textContent = 'Загрузка...';
            try {
                dataDiv.textContent = 'Расписание загружено (тест)';
            } catch (e) {
                dataDiv.textContent = 'Ошибка: ' + e.message;
            }
        }
    </script>
</body>
</html>
